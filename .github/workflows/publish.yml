name: Publish to PyPI

# Builds the charter wheel + sdist and publishes on a version tag, matching how
# BoundFlow's SDK ships.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token to store. One-time setup: on
# PyPI, add a trusted publisher for this repo with
#   workflow: publish.yml   environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tag is what a user will `pip install`, so it has to agree with the
      # version in the file rather than being a label beside it.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != version:
              raise SystemExit(f"tag v{tag} != pyproject version {version}")
          print(f"tag and version agree: {version}")
          PY

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
