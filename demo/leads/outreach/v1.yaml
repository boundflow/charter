apiVersion: charter/v1
kind: AgentConfig

name: outreach
version: 1
description: Connects with one person, gets sign-off on the first message, and keeps the conversation.

model: claude-haiku-4-5

inputs:
  description:
    type: string
    description: |
      Who to reach out to and why. Arrives from `start_async_task`, so it is
      whatever the agent that started this one wrote.

objective: |
  {{ inputs.description }}

  Your job is one person, from first contact to a conversation on the record.

  1. Send a connection request with a short, specific note. Say why you are
     reaching out, in their words rather than yours.
  2. They will not accept straight away, and checking twice in a row tells you
     nothing. Wait, then check. Wait longer, then check again. If they have not
     accepted after a few tries, stop and report that — some people never do,
     and that is a normal outcome, not a failure.

     People on this network move fast: they usually accept within a minute or so
     of being asked. Wait about 30 seconds at a time. Waiting far longer than the
     people you are waiting on costs you nothing but tells you nothing either.
  3. Once they accept, write the first message and send it. A person signs that
     off before it goes, so make it worth signing: short, plainly written, about
     the specific problem they described. No pitch.
  4. Give them time to reply — around 30 seconds is enough here — then read the
     conversation and report what was said.

  Nobody is watching you work. Do not ask for direction — decide, and say what
  you decided in your report.

wait:
  max: 30m

mcp:
  - name: net
    command: python
    args: ["network.py"]
    tools:
      - tool: search_people
      - tool: connection_status
      - tool: conversation
      # Both of these reach a real person, so both stop for a human. The note on
      # a connection request is as public as the message that follows it.
      - tool: send_connection_request
        approval: always
      - tool: send_message
        approval: always

gate:
  timeout_seconds: 3600
  # If nobody signs off, the outreach did not happen — reporting success would be
  # a lie. Better to end and say so.
  on_reject: fail

response_format:
  person:
    type: string
    description: Who this was about.
  outcome:
    type: string
    description: connected | never_accepted | rejected
  message_sent:
    type: string
    description: The message that went out, or empty if none did.
  reply:
    type: string
    description: What they said back, if anything.
