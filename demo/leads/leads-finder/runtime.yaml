apiVersion: charter/v1
kind: RuntimePolicy

agent: leads-finder

per_run:
  # One agent now runs the whole campaign, so this is the campaign's ceiling
  # rather than one lead's. Most of the calls go on checking: every round of
  # waiting costs a turn to look, whether or not anyone moved.
  max_llm_calls: 80
  max_cost_usd: 3.00
  # Working time, not wall clock — the waiting doesn't count, so a campaign that
  # runs for a week still only spends minutes of this.
  max_seconds: 7200
  max_tool_failures: 3

limits:
  max_tool_seconds: 30

authority:
  # A day, because the approver is a person who may not be at a terminal. The
  # agent's own config no longer carries this: how long you have to answer is
  # about you, not about what the agent does.
  approval_timeout_seconds: 86400
  question_timeout_seconds: 86400
  # Default-deny over the harness's own tools. It reads its skill and nothing
  # else: no reason to write files, run commands, or start other agents. Declared
  # MCP tools are permitted regardless of what is listed here.
  allowed_capabilities: [read]
