apiVersion: charter/v1
kind: RuntimePolicy

agent: leads-finder

per_run:
  max_cost_usd: 3.00
  max_llm_calls: 80
  max_seconds: 7200
  max_tool_failures: 3

limits:
  max_tokens_per_call: 1024
  max_call_seconds: 60
  max_tool_seconds: 30

authority:
  allowed_capabilities: [read]
  approval_timeout_seconds: 86400
  question_timeout_seconds: 86400
