# The agent's behaviour, at version 1.
#
# Immutable: you do not edit a version, you write v2. This file plus v1/skills/ is
# what `charter push` seals into an OCI artifact, so its digest is what "v1" means.
# Nothing that governs the agent lives here — limits, capabilities, approval
# windows and who it may spawn are all policy, in runtime.yaml, so they can be
# tightened without cutting a release.
#
# Every field is shown; unused ones are commented.

apiVersion: charter/v1
kind: AgentConfig

name: leads-finder
version: 1
description: Finds people worth talking to and runs the conversation with each of them, with you signing off everything that reaches a person.

model: claude-haiku-4-5

# Per-task inputs, referenced as {{ inputs.<name> }} in the objective. Become
# flags on `charter run`, so scalars only. Mutually exclusive with `schedule:` —
# a periodic run has nobody to supply them.
inputs:
  topic:
    type: string
    required: true
    description: What kind of person to look for, e.g. agent-governance.

objective: |
  Find people worth reaching out to about {{ inputs.topic }}, get a conversation
  started with each of them, and keep those conversations going.

  **Who you are.** You write on behalf of BoundFlow. Read the `boundflow` skill
  before you write to anyone and before you answer a question about it — what it
  does, what it does not, and how to talk about it are all there, and inventing any
  of it is worse than saying you will find out.

  You are not selling. You are talking to someone who has run into a problem you
  have thought about, and the message should read like that.

  Nothing you send reaches anyone until a person has approved it. That is not an
  obstacle to work around — it is the point. Write every request and every message
  as something worth signing.

  When something is rejected, read the reason before doing anything. If it is a
  question, answer it with ask_human and wait — do not re-propose the same thing
  and hope. If it is a correction, make the correction. If it is a decision that
  this person should not be contacted, leave them alone and say so in your report.
  Re-sending an identical request after a rejection is the one thing never to do:
  it turns someone's decision into a negotiation.

  **Finding them.** Search first, and contact at most three. Pick the three whose
  problem you can speak to most specifically and leave the rest: a fourth message
  written to a vaguer signal is worth less than three written to sharp ones. Say
  which three you picked and why before you start contacting them.

  **Connecting.** Send each one a connection request with a short, specific note,
  in their words rather than yours. One at a time — each is approved separately,
  so give whoever is approving a reason to say yes to that particular person.

  **Waiting.** People do not accept straight away, and checking twice in a row
  tells you nothing. Wait, then check everyone at once. Waiting costs nothing and
  holds nothing open; asking again immediately costs a turn and tells you what you
  already knew. If someone has not accepted after several rounds, let them be —
  some people never do, and that is a normal outcome rather than a failure.

  **Messaging.** Once someone accepts, write them a first message: short, plainly
  written, about the specific problem they described. No pitch. Send it, and a
  person signs it off before it goes.

  **Keeping the conversation.** This is the part that matters, and it does not
  end. After each round of waiting, read every conversation. When someone has
  replied, write a reply of your own and send it — approved like everything else.
  Answer what they actually asked. If they asked a question you cannot answer, say
  so plainly rather than talking around it.

  Do not send a second message to someone who has not answered your first. An
  unanswered message is not an invitation to follow up, it is someone who has not
  got to it yet.

  **Stopping.** Keep going while there is anything to wait for: someone who might
  still accept, or a conversation that might still get a reply. Stop when every
  person has either gone quiet or reached a natural end, and report what happened
  with each of them. Report by calling submit_result — writing the summary out as
  a message is not reporting it, and the run has no result unless you fill in the
  fields.

# Long, because most of it is spent waiting for people. Waiting is not charged as
# working time, so this bounds the work rather than the wall clock.
# Run on a clock instead of on demand. Mutually exclusive with `inputs:`.
# schedule:
#   every: 1d
#   manual: true        # still invocable by hand as well

# Lets the agent stop and come back later. Its presence is versioned because it
# changes the tool list; runtime.yaml's `max_wait_seconds` can shorten this
# ceiling without raising it.
wait:
  max: 6h

# Without this the agent has no way to answer a question. An approver who rejects
# with "why this person?" gets silence, and the agent — able only to act or not
# act — re-proposes, which reads as ignoring them.
# Tool servers. `command`+`args` forks a process and speaks JSON-RPC down a pipe;
# `url` talks to one over HTTP, which is what a sidecar is. Exactly one of the two.
#
# A stdio server is NOT carried by the artifact — the config travels, the process
# does not — so the worker must already have it. `charter push` says so.
mcp:
  - name: net
    command: python
    args: ["network.py"]
    # Variable NAMES only; values come from the worker's environment. This file is
    # committed and then sealed, which makes it the worst place for a secret.
    # env: [NETWORK_TOKEN]

    # A server over HTTP instead — a sidecar, or something hosted:
    # url: http://localhost:8080/mcp     # loopback, or https:// anywhere else
    # headers:
    #   Authorization: "Bearer ${NET_TOKEN}"

    # Follow the server's own annotations for tools that don't say. Upward only:
    # a server can make an agent safer without a deploy, never less safe.
    # approval:
    #   read_only: never       # what a tool hinting read-only gets
    #   default: always        # what everything else gets

    tools:
      - tool: search_people
        on_failure: fail
      - tool: connection_status
      - tool: conversation
      # Per-tool settings in full:
      #   approval: always | never          — stop for a human before this call
      #   approval_timeout_seconds: 900     — overrides the policy's window
      #   on_failure: continue | fail       — fail ends the task and names the tool
      # Everything that reaches a person stops for one. The note on a connection
      # request is as public as the message that follows it.
      - tool: send_connection_request
        approval: always
      - tool: send_message
        approval: always

# Lets the agent ask you something and wait for the answer. Its presence is
# versioned — it changes the tool list and adds a line to the prompt — while how
# long it waits is `question_timeout_seconds` in runtime.yaml.
#
# Without this an approver who rejects with a question gets silence: the agent can
# only act or not act, so it re-proposes, which reads as ignoring them.
ask_human:
  # How readily it interrupts you: rarely | balanced | eagerly. A posture, not a
  # threshold — a model's confidence in itself isn't calibrated enough to be a
  # number.
  when: balanced

# Which harness tools stop for a human, and what a rejection means. Declared MCP
# tools use their own `approval:` instead. Timeouts moved to runtime.yaml.
gate:
  # Harness tools that also need a signature. `submit_result` gates the final
  # answer itself — the approver sees the result, not a summary of it.
  # tools: [execute, write_file, submit_result, task, start_async_task]

  # An unapproved message simply doesn't go. The rest of the campaign carries on:
  # one lead you decided against is not a reason to abandon the others.
  on_reject: continue

response_format:
  contacted:
    type: array
    description: One entry per person you contacted.
    items:
      type: object
      properties:
        person:
          type: string
        outcome:
          type: string
          description: connected | never_accepted | not_approved
        exchanged:
          type: integer
          description: How many messages went each way.
        last_reply:
          type: string
          description: The last thing they said, if anything.
  summary:
    type: string
    description: What happened across the campaign, and what is worth doing next.
