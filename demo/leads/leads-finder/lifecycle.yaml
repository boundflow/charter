apiVersion: charter/v1
kind: LifecyclePolicy

agent: leads-finder

rules:
  - when:
      metric: num_failures
      threshold: 3
    then:
      pause:
        window: 10

  - when:
      metric: approval_rejections
      threshold: 5
    then:
      cooldown:
        window: 20
        seconds: 3600

