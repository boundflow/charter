apiVersion: charter/v1
kind: AgentConfig

name: refund-demo
version: 1
description: Decides whether a duplicate-charge ticket deserves a refund.

model: claude-haiku-4-5

objective: |
  Resolve the refund request on ticket {{ inputs.ticket_id }}.

  Read the ticket, then look up every charge it mentions before deciding anything.
  A refund is warranted when the customer was charged twice for the same order on
  the same day. It is not warranted merely because they changed their mind.

  Never refund more than ${{ inputs.max_refund_usd }}. A refund stops for a human
  before it goes through, so say plainly what you are about to do and why — that
  sentence is what the approver reads.

inputs:
  ticket_id:
    type: string
    required: true
    description: The ticket to resolve.
  max_refund_usd:
    type: number
    default: 500
    description: Ceiling you may propose.

mcp:
  - name: desk
    command: python
    args: ["mcp_server.py"]
    tools:
      - tool: get_ticket
        on_failure: fail
      - tool: get_charge
      - tool: create_refund
        approval: always
        on_failure: fail

response_format:
  resolution:
    type: string
    description: What you did and why, in two sentences.
  refunded_usd:
    type: number
    description: Amount refunded, or 0 if none.

gate:
  timeout_seconds: 1800
