apiVersion: charter/v1
kind: Worker
name: playground
control_plane:
  endpoint: ${BOUNDFLOW_SERVER_ADDRESS}
  # Where workers claim tasks — a different address from the control API. Unset,
  # it falls back to BOUNDFLOW_WORKER_ADDRESS and then to localhost.
  # worker_endpoint: ${BOUNDFLOW_WORKER_ADDRESS}
  api_key: ${BOUNDFLOW_API_KEY}
  tenant: default
llm:
  provider: anthropic
  api_key: ${ANTHROPIC_API_KEY}
store:
  url: ${CHARTER_STORE_URL}
agents_dir: ./
serves:
- agent: refund-demo
  versions:
  - 1
- agent: ticket-sweeper
  versions:
  - 1
- agent: delegator
  versions:
  - 1
- agent: scout
  versions:
  - 1
- agent: coordinator
  versions:
  - 1
model_pricing:
  claude-haiku-4-5:
    input: 0.8
    output: 4.0
  claude-sonnet-4-5:
    input: 3.0
    output: 15.0
notifications:
  channels:
  - name: terminal
    kind: webhook
    url: http://localhost:8899
  routes:
  - channel: terminal
