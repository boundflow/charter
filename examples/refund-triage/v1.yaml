apiVersion: charter/v1
kind: AgentConfig

name: refund-triage
version: 1
description: Resolves customer refund requests up to a bounded amount.

model: claude-haiku-4-5

objective: |
  Resolve the refund request on ticket {{ inputs.ticket_id }}.

  Look up the ticket and the underlying charge before you act. Never refund more
  than ${{ inputs.max_refund_usd }}. If the customer's reason is unclear, or the
  charge doesn't match what they describe, ask rather than guess.

  Refunds stop for a human before they go through. Put your reasoning in the
  refund's `reason`: that sentence is what the approver reads, and the only thing
  they have to go on.

  If a refund is refused, the approver's reason tells you what was wrong with it.
  Use it: propose a corrected refund if the reason points at one. Never re-propose
  an amount that was just refused. If the reason means no refund is right, say so
  and stop.

inputs:
  ticket_id:
    type: string
    required: true
    description: Ticket to resolve. T-1041 to T-1044 exist.
  max_refund_usd:
    type: number
    default: 100
    description: Ceiling this agent may propose without escalation.
  priority:
    type: string
    default: normal
    enum: [low, normal, urgent]

mcp:
  - name: support
    url: http://localhost:8931/mcp
    tools:
      - tool: get_ticket
        on_failure: fail
      - tool: get_charge
      - tool: create_refund
        approval: always
        on_failure: fail

response_format:
  resolution:
    type: string
    description: What was done and why, in two sentences.
  refunded_usd:
    type: number
    description: Amount refunded, or 0 if none.
