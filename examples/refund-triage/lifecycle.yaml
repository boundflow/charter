apiVersion: charter/v1
kind: LifecyclePolicy

agent: refund-triage

# `window` is a lookback over recent runs and a minimum sample size: a rule does
# not evaluate until that many runs exist. Small windows here so the rules can
# fire in a demo.
rules:
  # If 2 refunds are turned down in the last 3 runs, stay paused until someone
  # runs `charter resume`.
  - when: { metric: approval_rejections, threshold: 2 }
    then: { pause: { window: 3 } }

  # If 2 tasks failed in the last 3 runs, pause the agent.
  - when: { metric: num_failures, threshold: 2 }
    then: { pause: { window: 3 } }

  # 5 dollar budget across 5 runs. If the agent crosses it, stop for five
  # minutes, then continue.
  - when: { metric: cost, threshold: 5.00 }
    then: { cooldown: { window: 5, seconds: 300 } }
