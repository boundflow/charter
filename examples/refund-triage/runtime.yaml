apiVersion: charter/v1
kind: RuntimePolicy

agent: refund-triage

per_run:
  max_tool_failures: 3
  max_cost_usd: 0.30
  max_llm_calls: 40
  tool_call_limits:
    - tool: stripe__get_charge
      max_calls: 5
    - tool: zendesk__search_tickets
      max_calls: 10
  # Covers every way the harness can read a file, so the cap survives it shipping
  # a fourth one. Capping `read_file` alone would not.
  capability_call_limits:
    - capability: read
      max_calls: 30

limits:
  max_tokens_per_call: 1024
  max_call_seconds: 60

# What the agent may reach, as opposed to how much it may spend. Not versioned:
# tightening this should not require cutting a release, and it has to be
# changeable on an agent that is already running.
authority:
  # The harness brings its own filesystem. This agent has no business writing to
  # it, so it gets read only; declared MCP tools are always permitted regardless.
  allowed_capabilities: [read]
