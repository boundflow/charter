apiVersion: charter/v1
kind: RuntimePolicy

agent: refund-triage

per_run:
  max_drafts: 3
  max_questions: 2
  max_tool_failures: 3
  max_cost_usd: 0.30
  max_llm_calls: 40
  tool_call_limits:
    - tool: stripe__get_charge
      max_calls: 5
    - tool: zendesk__search_tickets
      max_calls: 10

limits:
  max_tokens_per_call: 1024
  max_call_seconds: 60
