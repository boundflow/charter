apiVersion: charter/v1
kind: RuntimePolicy

agent: refund-triage

per_run:
  max_tool_failures: 3
  max_cost_usd: 0.30
  max_llm_calls: 40
  tool_call_limits:
    # Let the agent get 3 chances to get the refund amount right, we will give it feedback during the gate
    - tool: support__create_refund
      max_calls: 3
    - tool: support__get_charge
      max_calls: 5
    - tool: support__get_ticket
      max_calls: 10
  # Every way the harness can read, not just read_file.
  capability_call_limits:
    - capability: read
      max_calls: 30

limits:
  max_tokens_per_call: 1024
  max_call_seconds: 60

# What the agent may reach. Re-applied on every `charter apply`.
authority:
  # Read only, on the harness's own filesystem. Declared MCP tools are unaffected.
  allowed_capabilities: [read]
