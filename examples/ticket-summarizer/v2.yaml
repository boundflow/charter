apiVersion: charter/v1
kind: AgentConfig

name: ticket-summarizer
version: 2
description: Summarizes what changed across open tickets since the last look.

model: claude-haiku-4-5

objective: |
  Review the open support tickets and summarize what needs a human's attention.
  Lead with anything that has been waiting longest.

  For each one, open the ticket and the charge behind it, and say what the
  customer is owed if anything. Do not summarize from the subject line alone.

mcp:
  - name: support
    url: http://localhost:8931/mcp
    tools:
      - tool: search_tickets
        on_failure: fail
      - tool: get_ticket

response_format:
  summary:
    type: string
    description: What needs attention, newest concerns first.
  needs_attention:
    type: integer
    description: How many tickets warrant a human look.
