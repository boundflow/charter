[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `boundflow-charter`; the package, the CLI and the config's
# apiVersion stay `charter`. PyPI refuses the bare name, and the prefix is how this
# is branded anyway.
name = "boundflow-charter"
version = "0.1.0"
description = "Declarative, governed agents on BoundFlow — objective, tools, and policy as YAML."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "deepagents", "mcp", "governance", "control-plane"]
classifiers = [
    # Pre-alpha, and the configuration format is expected to change.
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # 0.6.0 is the floor: the governor Charter runs agents under (run_governed,
    # agent_governor), the shared renderer (boundflow.cli.output), and the console
    # labels `charter ui` sets all arrived in it.
    "boundflow>=0.6.0",
    # The harness, and required rather than optional. Charter is the
    # use-an-existing-harness product: an install that can't run deepagents isn't a
    # smaller Charter, it's a Charter that does nothing. BoundFlow keeps these
    # optional for the opposite and equally correct reason — it governs whatever
    # loop you bring, so it must not care which one that is.
    "deepagents>=0.7.7",
    "langchain-core>=1.5",
    "langgraph>=1.2",
    # A separate distribution from langgraph: `langgraph.checkpoint.postgres` and
    # `langgraph.store.postgres`.
    "langgraph-checkpoint-postgres>=3.1",
    # The only model provider wired up today — `worker.yaml` refuses any other.
    # `init_chat_model` lives here, and it is how a provider gets built. Declared
    # rather than inherited from deepagents: we import it directly now.
    "langchain>=1.0",
    # Anthropic is the only integration installed by default, because a default has
    # to be something. Any other provider is an extra, or install its package.
    "langchain-anthropic>=0.3",
    # OCI artifacts: `charter push` publishes an agent version to the customer's
    # own registry, and the worker pulls one. Their registry, their `docker login`,
    # their retention — none of it ours to build.
    "oras>=0.2",
    # The MCP client, and the adapter that turns a server's tools into the
    # harness's. `anthropic` arrives via boundflow.
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout"]
# `charter ui` serves BoundFlow's console. The extra is theirs — starlette and
# uvicorn arrive through it, so the two consoles can never want different ones.
ui = ["boundflow[ui]"]
# `trace_sink: {kind: otel}` builds an OTLP exporter. Theirs again, so the sink and
# the exporter can never disagree about the OTel version.
otel = ["boundflow[otel]"]
# Model providers. `llm.provider` takes anything LangChain can build; these are
# just the integration packages, so you can name one instead of looking it up.
openai = ["langchain-openai>=0.2"]
google = ["langchain-google-genai>=2.0"]
bedrock = ["langchain-aws>=0.2"]
ollama = ["langchain-ollama>=0.2"]
groq = ["langchain-groq>=0.2"]

[project.urls]
Homepage = "https://github.com/boundflow/charter"
Source = "https://github.com/boundflow/charter"
Issues = "https://github.com/boundflow/charter/issues"

[project.scripts]
charter = "charter.cli:main"

[tool.setuptools.packages.find]
include = ["charter*"]

[tool.pytest.ini_options]
# e2e is excluded by default: it needs a running control plane. `pytest tests/e2e`
# opts in.
testpaths = ["tests"]
# No test should take minutes. A control-plane call with no deadline hangs forever
# otherwise: one did, for 1h46m, until the CI job was cancelled by hand.
timeout = 180
addopts = "--ignore=tests/e2e"
asyncio_mode = "auto"
